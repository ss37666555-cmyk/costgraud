[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "costguard"
version = "0.1.0"
description = "A lightweight Azure FinOps CLI guardrail for Terraform plans"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CostGuard Team" }
]
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
costguard = "costguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
